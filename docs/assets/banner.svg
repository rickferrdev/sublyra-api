<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 10px; ry: 10px; }
      .header { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; line-height: 1.4; }
      .prompt { fill: #38bdf8; font-weight: bold; }
      .cmd { fill: #f1f5f9; }
      .path { fill: #60a5fa; }
      .json-key { fill: #f472b6; }
      .json-val { fill: #a7f3d0; }
      .status-code { fill: #4ade80; font-weight: bold; }
      .header-name { fill: #94a3b8; }
      .log-relay { fill: #fbbf24; font-weight: bold; }
      .log-worker { fill: #c084fc; font-weight: bold; }
      .log-msg { fill: #cbd5e1; }
      .accent { fill: #818cf8; }
      .muted { fill: #475569; }
    </style>
  </defs>

  <!-- Container -->
  <rect class="bg" width="840" height="470" rx="10" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top bar -->
  <path class="header" d="M0 10C0 4.477 4.477 0 10 0h820c5.523 0 10 4.477 10 10v30H0V10z" stroke="#30363d" stroke-width="1"/>
  <circle class="dot-red" cx="20" cy="20" r="6"/>
  <circle class="dot-yellow" cx="40" cy="20" r="6"/>
  <circle class="dot-green" cx="60" cy="20" r="6"/>
  <text class="title" x="420" y="24" text-anchor="middle">sublyra-api — outbox &amp; rabbitmq workflow</text>

  <!-- Terminal Content -->
  <g class="code" transform="translate(24, 60)">
    <!-- Request 1 -->
    <text y="0">
      <tspan class="prompt">user@sublyra:~$ </tspan>
      <tspan class="cmd">curl -i -X POST http://localhost:8080/api/v1/subscription \</tspan>
    </text>
    <text y="22">
      <tspan class="cmd">  -H </tspan><tspan class="json-val">"Content-Type: application/json"</tspan>
      <tspan class="cmd"> -d </tspan><tspan class="json-val">'{"email":"person@example.com"}'</tspan>
    </text>

    <!-- Response 1 -->
    <text y="54">
      <tspan class="status-code">HTTP/1.1 202 Accepted</tspan>
    </text>
    <text y="74">
      <tspan class="header-name">Content-Type:</tspan> <tspan class="cmd">application/json</tspan>
    </text>
    <text y="94">
      <tspan class="cmd">{</tspan><tspan class="json-key">"code"</tspan><tspan class="cmd">:</tspan> <tspan class="json-val">"SUBSCRIPTION_PENDING"</tspan><tspan class="cmd">, </tspan><tspan class="json-key">"message"</tspan><tspan class="cmd">:</tspan> <tspan class="json-val">"subscription requested successfully"</tspan><tspan class="cmd">}</tspan>
    </text>

    <!-- Outbox & RabbitMQ Logs -->
    <text y="130">
      <tspan class="muted">────────────────────── Async Event Pipeline ──────────────────────</tspan>
    </text>
    <text y="154">
      <tspan class="log-relay">[OUTBOX-RELAY]</tspan> <tspan class="log-msg">Polled pending event </tspan><tspan class="accent">#outbox_66d9ef</tspan><tspan class="log-msg"> (status: pending ──&gt; processing)</tspan>
    </text>
    <text y="176">
      <tspan class="log-relay">[RABBITMQ-PUB]</tspan> <tspan class="log-msg">Published to exchange </tspan><tspan class="path">sublyra.events</tspan> <tspan class="log-msg">[key: subscription.confirmation.requested]</tspan>
    </text>
    <text y="198">
      <tspan class="log-worker">[EMAIL-WORKER]</tspan> <tspan class="log-msg">Consumed event from queue </tspan><tspan class="path">sublyra.email</tspan>
    </text>
    <text y="220">
      <tspan class="log-worker">[RESEND-MAILER]</tspan> <tspan class="log-msg">Sent confirmation email to </tspan><tspan class="json-val">person@example.com</tspan> <tspan class="status-code">✔ Delivered</tspan>
    </text>

    <!-- Request 2: Confirmation -->
    <text y="260">
      <tspan class="prompt">user@sublyra:~$ </tspan>
      <tspan class="cmd">curl -i -X POST </tspan><tspan class="json-val">"http://localhost:8080/api/v1/subscription/confirm?token=eyJhbGci..."</tspan>
    </text>

    <!-- Response 2 -->
    <text y="292">
      <tspan class="status-code">HTTP/1.1 202 Accepted</tspan>
    </text>
    <text y="312">
      <tspan class="cmd">{</tspan><tspan class="json-key">"code"</tspan><tspan class="cmd">:</tspan> <tspan class="json-val">"SUBSCRIPTION_CONFIRMED"</tspan><tspan class="cmd">, </tspan><tspan class="json-key">"message"</tspan><tspan class="cmd">:</tspan> <tspan class="json-val">"subscription confirmed successfully"</tspan><tspan class="cmd">}</tspan>
    </text>

    <!-- Final status -->
    <text y="352">
      <tspan class="prompt">user@sublyra:~$ </tspan>
      <tspan class="status-code">✔ State transition complete: pending ──&gt; subscribed</tspan>
    </text>
  </g>
</svg>
